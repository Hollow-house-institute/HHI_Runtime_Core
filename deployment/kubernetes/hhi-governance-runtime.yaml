apiVersion: apps/v1
kind: Deployment
metadata: {name: hhi-governance-runtime}
spec:
  replicas: 1
  selector: {matchLabels: {app: hhi-governance-runtime}}
  template:
    metadata: {labels: {app: hhi-governance-runtime}}
    spec:
      containers:
        - name: runtime
          image: hhi-governance-runtime:latest
          ports: [{containerPort: 8090}]
---
apiVersion: v1
kind: Service
metadata: {name: hhi-governance-runtime}
spec:
  selector: {app: hhi-governance-runtime}
  ports: [{port: 8090,targetPort: 8090}]
